gbject_selection:
  muons:
    field: events.Muon
    cuts:
      - events.Muon.pt > 10
      - np.abs(events.Muon.eta) < 2.4
      - np.abs(events.Muon.dxy) < 0.5
      - np.abs(events.Muon.dz) < 1
      - working_points.muon_iso(events, 'tight')
      - working_points.muon_id(events, 'tight')
  electrons:
    field: events.Electron
    cuts:
      - events.Electron.pt > 10
      - np.abs(events.Electron.eta) < 2.4
      - events.Electron.dxy < 0.5
      - events.Electron.dz < 1
      - working_points.electron_id(events, 'wp80iso')
      - delta_r_higher(events.Electron, objects['muons'], 0.4)
  jets:
    field: events.Jet
    cuts:
      - events.Jet.pt > 20
      - np.abs(events.Jet.eta) < 2.5
      - working_points.jet_id(events, 'tightlepveto')
      - delta_r_higher(events.Jet, objects['muons'], 0.4)
      - delta_r_higher(events.Jet, objects['electrons'], 0.4)
  dimuons:
    field: select_dimuons
    cuts:
      - objects['dimuons'].l1.delta_r(objects['dimuons'].l2) > 0.3
      - objects['dimuons'].l1.charge * objects['dimuons'].l2.charge < 0
      - (objects['dimuons'].p4.mass > 60.0) & (objects['dimuons'].p4.mass < 120.0)
event_selection:
  hlt_paths:
    Muon:
      - SingleMu
  selections:
    trigger: get_trigger_mask(events, hlt_paths, dataset, year)
    trigger_match: get_trigger_match_mask(events, hlt_paths, year, events.Muon) 
    lumimask: get_lumi_mask(events, year)
    atleast_one_goodvertex: events.PV.npvsGood > 0
    leading_muon_pt: ak.fill_none(ak.firsts(objects['dimuons'].l1.pt) > 27, False)
    subleading_muon_pt: ak.fill_none(ak.firsts(objects['dimuons'].l2.pt) > 15, False)
    electron_veto: ak.num(objects['electrons']) == 0
    two_muons: ak.num(objects['muons']) == 2
    one_dimuon: ak.num(objects['dimuons']) == 1
    one_jet: ak.num(objects['jets']) == 1
  categories:
    base:
      - trigger
      - trigger_match
      - lumimask
      - atleast_one_goodvertex
      - leading_muon_pt
      - subleading_muon_pt
      - two_muons
      - one_dimuon
      - electron_veto
      - one_jet
corrections:
  objects:
    - jets
    - muons
    - electrons
  event_weights:
    genWeight: true
    pileupWeight: true
    partonshowerWeight: true
    lhepdfWeight: true
    lhescaleWeight: true
    nnlopsWeight: false
    muon:
      - id: tight
      - iso: tight
      - trigger: true
histogram_config:
  add_syst_axis: true
  add_weight: true
  axes:
    dimuon_mass:
      type: Regular
      bins: 100
      start: 10
      stop: 150
      label: $m(\mu\mu)$ [GeV]
      expression: objects['dimuons'].z.mass
    dimuon_pt:
      type: Regular
      bins: 50
      start: 30
      stop: 300
      label: $p_T(\mu\mu)$ [GeV]
      expression: objects['dimuons'].z.pt
    dimuon_dr:
      type: Regular
      bins: 50
      start: 0
      stop: 5
      label: $\Delta R(\mu_1, \mu_2)$
      expression: LorentzVector.delta_r(objects['dimuons'].l1, objects['dimuons'].l2)
    dimuon_deta:
      type: Regular
      bins: 50
      start: 0
      stop: 5
      label: $|\Delta \eta(\mu_1, \mu_2)|$
      expression: np.abs(objects['dimuons'].l1.eta - objects['dimuons'].l2.eta)
    leading_muon_pt:
      type: Regular
      bins: 50
      start: 30
      stop: 300
      label: $p_T(\mu_1)$ [GeV]
      expression: objects['dimuons'].l1.pt
    subleading_muon_pt:
      type: Regular
      bins: 50
      start: 30
      stop: 300
      label: $p_T(\mu_2)$ [GeV]
      expression: objects['dimuons'].l2.pt
    leading_muon_eta:
      type: Regular
      bins: 50
      start: -2.5
      stop: 2.5
      label: $\eta(\mu_1)$
      expression: objects['dimuons'].l1.eta
    subleading_muon_eta:
      type: Regular
      bins: 50
      start: -2.5
      stop: 2.5
      label: $\eta(\mu_2)$
      expression: objects['dimuons'].l2.eta
    muon_pt:
      type: Regular
      bins: 50
      start: 30
      stop: 300
      label: $p_T(\mu)$ [GeV]
      expression: objects['muons'].pt
    muon_eta:
      type: Regular
      bins: 50
      start: -2.5
      stop: 2.5
      label: $\eta(\mu)$
      expression: objects['muons'].eta
    muon_phi:
      type: Regular
      bins: 50
      start: -3.14159
      stop: 3.14159
      label: $\phi(\mu)$
      expression: objects['muons'].phi
    jet_pt:
      type: Regular
      bins: 50
      start: 20
      stop: 500
      label: $p_T(j)$ [GeV]
      expression: objects['jets'].pt
    jet_eta:
      type: Regular
      bins: 50
      start: -2.4
      stop: 2.4
      label: $\eta(j)$
      expression: objects['jets'].eta
    jet_phi:
      type: Regular
      bins: 50
      start: -3.14159
      stop: 3.14159
      label: $\phi(j)$
      expression: objects['jets'].phi
    jet_multiplicity:
      type: Regular
      bins: 10
      start: 0
      stop: 10
      label: jets multiplicity
      expression: ak.num(objects['jets’])
    leadingjet_cvsl:
      type: Regular
      bins: 50
      start: 0
      stop: 1
      label: Leading Jet CvsL
      expression: ak.pad_none(objects['jets'], target=2)[:, 0].btagPNetCvL
    leadingjet_cvsb:
      type: Regular
      bins: 50
      start: 0
      stop: 1
      label: Leading Jet CvsB
      expression: ak.pad_none(objects['jets'], target=2)[:, 0].btagPNetCvB
    leadingjet_flavour::
      type: Regular
      bins: 6
      start: 0
      stop: 6
      label: jets hadronFlavour
      expression: objects['jets'].hadronFlavour
    jet_partonflavour:
      type: Regular
      bins: 6
      start: 0
      stop: 6
      label: jets partonFlavour
      expression: objects['jets'].partonFlavour
  layout: 
    dimuon_mass: 
      - dimuon_mass
    dimuon_pt: 
      - dimuon_pt
    dimuon_dr: 
      - dimuon_dr
    dimuon_deta: 
      - dimuon_deta
    leading_muon_pt: 
      - leading_muon_pt
    leading_muon_eta: 
      - leading_muon_eta
    subleading_muon_pt: 
      - subleading_muon_pt
    subleading_muon_eta: 
      - subleading_muon_eta
    muon_pt: 
      - muon_pt
    muon_eta: 
      - muon_eta
    muon_phi: 
      - muon_phi
    jet_pt: 
      - jet_pt
    jet_eta: 
      - jet_eta
    jet_phi: 
      - jet_phi
    jet_multiplicity: 
      - jet_multiplicity
    leading_jet:
      - leadingjet_flavour
      - leadingjet_cvsb
      - leadingjet_cvsl
    partonflavour:
      - jet_partonflavour
    vertex
      - npvs
